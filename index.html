<head>
  <meta charset="UTF-8" />
  <title>La Meriendita 25 - Bonpland, Corrientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- METADATOS BÁSICOS PARA BUSCADORES -->
  <meta name="description" content="Página oficial de La Meriendita 25 de Bonpland, Corrientes. Un proyecto escolar y emprendimiento a cargo de los alumnos del 4to año del Colegio secundario Amado Bonpland.">
  <meta name="keywords" content="Bonpland, Corrientes, proyecto, emprendimiento, información, pueblo, La Meriendita">
  <meta name="author" content="Juan Ferreyra y Amigos">
  <meta name="robots" content="index, follow">

  <!-- ENLACES DEL FAVICON (ICONO Y LOGO PARA GOOGLE Y PESTAÑA) -->
  <link rel="icon" type="image/png" href="https://lameriendita25.github.io/bonplandcorrientes/logo.png" />
  <link rel="shortcut icon" type="image/png" href="https://lameriendita25.github.io/bonplandcorrientes/logo.png" />
  <link rel="apple-touch-icon" href="https://lameriendita25.github.io/bonplandcorrientes/logo.png">

  <!-- CONFIGURACIÓN PARA REDES SOCIALES (OPEN GRAPH) -->
  <meta property="og:title" content="La Meriendita 25 - Bonpland, Corrientes" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lameriendita25.github.io/bonplandcorrientes/" />
  <meta property="og:description" content="Página oficial de La Meriendita 25 de Bonpland, Corrientes." />
  <meta property="og:image" content="https://lameriendita25.github.io/bonplandcorrientes/logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    :root {
      --accent: #00adb5;
      --accent-2: #00ffcc;
      --card-bg: rgba(0,0,0,0.5);
      --text-light: #e6f9f7;
      --muted: #cbd5d5;
    }

    html, body { 
      min-height: 100%; 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      padding: 10px; 
      font-family: Arial, sans-serif;
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    header {
      text-align: center;
      background-color: rgba(0,0,0,0.6);
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    header h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.5em; 
      color: var(--accent);
      margin: 0;
    }

    nav { 
      margin-top: 12px; 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 8px; 
    }
    
    nav a {
      color: white;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }
    nav a:hover { 
      background: var(--accent); 
      transform: scale(1.05);
    }

    main { 
      max-width: 1100px; 
      margin: 0 auto; 
      padding-bottom: 40px; 
      width: 100%; 
    }

    .seccion { display: none; padding: 5px; }
    .activa { display: block; }

    .contenido-caja {
      background: rgba(0,0,0,0.55);
      padding: 20px;
      border-radius: 12px;
      margin: 15px auto;
      color: var(--text-light);
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      box-sizing: border-box;
    }

    .contenido-caja h2 { color: var(--accent); margin-top: 6px; }

    .texto-destacado {
      color: var(--accent-2);
      font-size: 1.1em;
      font-weight: 500;
      line-height: 1.5;
    }

    .curiosidad-box {
      background: linear-gradient(135deg, rgba(0, 173, 181, 0.15), rgba(0, 0, 0, 0.6));
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--accent);
      margin-top: 25px;
    }

    #redes ul { list-style: none; padding: 0; margin: 0; }
    #redes ul li { margin: 14px 0; }
    #redes a {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: rgba(255,255,255,0.05); border-radius: 10px;
      text-decoration: none; color: white;
      transition: background 0.3s;
    }
    #redes a:hover { background: rgba(255,255,255,0.15); }

    #contacto form {
      display: flex; flex-direction: column; gap: 14px;
      max-width: 520px; width: 100%; box-sizing: border-box; 
    }
    #contacto input, #contacto textarea { 
      padding: 12px; 
      border-radius: 8px; 
      border: none; 
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    #contacto button {
      background: var(--accent); color: #fff; padding: 12px;
      border-radius: 8px; border: none; cursor: pointer; font-weight: bold;
      transition: background 0.3s;
    }
    #contacto button:hover { background: #008f96; }

    #clima {
      text-align: center; margin: 20px auto 10px auto; max-width: 480px;
      padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.4);
    }

    .sheet-wrap { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .sheet {
      width: 100%; max-width: 850px; min-height: 350px;
      background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 8px;
      box-sizing: border-box;
    }
    .viewer { width: 100%; height: 500px; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,0.3); }
    .viewer iframe { width: 100%; height: 100%; border: 0; }

    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      cursor: pointer; font-weight: bold; text-decoration: none;
      display: inline-block; margin: 5px;
      transition: opacity 0.3s;
    }
    .btn:hover { opacity: 0.9; }

    @media (min-width: 768px) {
      body { padding: 20px; }
      header h1 { font-size: 3.5em; }
      .contenido-caja { padding: 25px; }
      .viewer { height: 600px; }
    }
  </style>
</head>
